<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#090d13" />
    </linearGradient>

    <!-- Blue Gradient -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#1f6feb" />
    </linearGradient>

    <!-- Green Gradient -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fb950" />
      <stop offset="100%" stop-color="#238636" />
    </linearGradient>

    <!-- Arc Gradient (Blue to Green) -->
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" />
      <stop offset="50%" stop-color="#388bfd" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>

    <!-- Subtle Glow Filters -->
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background App Tile -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#30363d" stroke-width="4" filter="url(#shadow)" />

  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="256" r="160" fill="#1f6feb" opacity="0.06" />

  <!-- Stylized Reload Arc (Smooth circular motion) -->
  <path d="M 256 86 A 170 170 0 1 1 112 166" 
        fill="none" 
        stroke="url(#arcGrad)" 
        stroke-width="26" 
        stroke-linecap="round" />

  <!-- Reload Arrow Head -->
  <polygon points="256,54 290,92 238,106" fill="#58a6ff" />

  <!-- Center Content: Code Diff Comparison Bars -->
  <g transform="translate(146, 176)">
    <!-- Top Bar: Modified Line (Blue) -->
    <rect x="0" y="0" width="220" height="34" rx="17" fill="url(#blueGrad)" opacity="0.22" />
    <rect x="0" y="0" width="8" height="34" rx="4" fill="url(#blueGrad)" />
    <!-- Modified Token Box -->
    <rect x="76" y="5" width="104" height="24" rx="8" fill="url(#blueGrad)" filter="url(#glowBlue)" />
    <!-- Tilde Symbol ~ -->
    <path d="M 28 17 C 32 12, 38 12, 42 17 C 46 22, 52 22, 56 17" fill="none" stroke="#58a6ff" stroke-width="4" stroke-linecap="round" />

    <!-- Bottom Bar: Added Line (Green) -->
    <rect x="0" y="66" width="220" height="34" rx="17" fill="url(#greenGrad)" opacity="0.22" />
    <rect x="0" y="66" width="8" height="34" rx="4" fill="url(#greenGrad)" />
    <!-- Full Added Code Bar -->
    <rect x="48" y="73" width="144" height="20" rx="6" fill="url(#greenGrad)" filter="url(#glowGreen)" />
    <!-- Plus Symbol + -->
    <path d="M 32 75 L 32 91 M 24 83 L 40 83" fill="none" stroke="#3fb950" stroke-width="4.5" stroke-linecap="round" />
  </g>
</svg>
