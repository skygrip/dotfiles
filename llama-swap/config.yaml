# ==============================================================================
# HEAVY WEIGHT MODELS
# ==============================================================================

# --- QWEN 3.8 FLASH NEXT 125B (BASALT RUNNER) ---
  qwen3.8-flash-next-basalt:
    name: "Qwen 3.8 Flash Next 125B (Basalt NVFP4)"
    description: "Qwen3.8-Flash-Next running on Basalt"
    checkEndpoint: /health
    ttl: 300
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: ${ctx}
    cmd: |
      ${basalt-server}
      --model "${env.USERPROFILE}/Build/Models/Qwen3.8-FN-GSQ-RCO-IQ3_S.basalt"
      --max-context ${ctx}
      --vram-reserve-mib 800
      --expert-cache auto
      --resident-experts
      --resident-budget-gib 40
      --prompt-cache 2
      --prefill auto
      --vision dynamic
      --kv int8
      --reasoning-budget-tokens 32768
      --alias qwen3.8-flash-next-basalt

# --- QWEN 3.8 FLASH NEXT 125B ---
  qwen3.8-flash-next:
    name: "Unsloth Qwen 3.8 Flash Next"
    description: "unsloth/Qwen3.8-Flash-Next-GGUF:UD-IQ4_XS"
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: ${ctx}
    cmd: |
      ${llama-server}
      ${default_args}
      -hf unsloth/Qwen3.8-Flash-Next-GGUF:UD-IQ4_XS
    filters:
      setParamsByID:
        "${MODEL_ID}:no_think":
          temperature: 0.7
          top_p: 0.80
          top_k: 20
          min_p: 0.0
          presence_penalty: 1.5
          chat_template_kwargs:
            enable_thinking: false
            reasoning_effort: "none"
        "${MODEL_ID}:think_medium":
          temperature: 1.0
          top_p: 0.95
          top_k: 20
          chat_template_kwargs:
            reasoning_effort: "medium"

