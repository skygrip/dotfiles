# ==============================================================================
# RESOURCE SWAP MATRIX CONCURRENT ROUTING
# ==============================================================================
# matrix:
#   # vars: Mapping alphanumeric short names (1-8 chars) to active model IDs
#   vars:
#     g12:  gemma4-12b
#     g12a: gemma4-12b-abliterated
#     g26:  gemma4-26ba4b
#     g26a: gemma4-26ba4b-abliterated
#     q35:  qwen3.6-35ba3b
#     g31:  gemma4-31b
#     q27:  qwen3.8-27b
#
#   # evict_costs: Relative weight protecting heavy models from premature eviction
#   evict_costs:
#     q35:  50  # Qwen 3.6 35B MoE + MTP (~22 GB)
#     g31:  45  # Gemma 4 31B Dense (~18 GB)
#     q27:  45  # Qwen 3.8 27B Dense (~16 GB)
#     g26:  40  # Gemma 4 26B MoE (~18 GB)
#     g26a: 40  # Gemma 4 26B MoE Abliterated (~18 GB)
#     g12:  10  # Gemma 4 12B (~10 GB)
#     g12a: 10  # Gemma 4 12B Abliterated (~10 GB)
#
#   # sets: DSL expressions defining valid concurrency combinations
#   sets:
#     # 1. MoE Dual-Engine: Keep primary MoE models loaded together
#     moe_coexistence: "q35 & (g26 | g26a)"
#
#     # 2. Dense Dual-Engine: Run Gemma 31B & Qwen 27B dense models together
#     dense_coexistence: "g31 & q27"
#
#     # 3. MoE + Dense Hybrid: Pair any MoE with a Dense model
#     moe_dense_mix: "(q35 | g26 | g26a) & (g31 | q27)"
#
#     # 4. Heavy + Fast Helper: Any heavy model paired with a fast 12B assistant
#     utility_helper: "(q35 | g26 | g26a | g31 | q27) & (g12 | g12a)"