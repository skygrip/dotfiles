# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
# ==============================================================================
# GLOBAL ENGINE CONFIGURATION
# ==============================================================================
host: "0.0.0.0"
port: 8080
globalTTL: 120
includeAliasesInList: true
healthCheckTimeout: 600

# ==============================================================================
# MACROS & ENVIRONMENT ALIASES
# ==============================================================================
macros:
  # ============================================================================
  # ACTIVE PROFILE: NVIDIA RTX 5080 (Windows / CUDA)
  # ============================================================================
  llama-server: "llama-server.exe --port ${PORT}"
  strata-server: "strata.exe launch --port ${PORT} --no-tui --yes"
  basalt-server: "${env.USERPROFILE}/Build/basalt/bin/Release/basalt.exe serve --port ${PORT} --host 127.0.0.1 --gpu 0"
  threads: 8
  threads_batch: 16
  batch: 2048
  ubatch: 1024
  fit: on
  fit_target: 512         # -fitt: VRAM safety headroom margin in MiB
  parallel_slots: 1
  ncmoe_gemma26: "-ncmoe 14"
  ncmoe_qwen35: "-ncmoe 18"
  gemma_template: "--chat-template-file ${env.USERPROFILE}/Build/dotfiles/llama-swap/templates/gemma4.jinja"

  hw_args: "-t ${threads} -tb ${threads_batch} -b ${batch} -ub ${ubatch} -fit ${fit} -fitt ${fit_target} -bs --no-mmproj-offload"
  kv_args: "--kv-unified --parallel ${parallel_slots}"

  # ============================================================================
  # PROFILE: Apple Silicon Mac Studio 128GB (Unified Memory & Metal)
  # ============================================================================
  # llama-server: "/opt/homebrew/bin/llama-server --port ${PORT}"
  # threads: 10           # 12 Performance Cores - 2 unloaded cores
  # threads_batch: 12     # Symmetrical prefill threads on M-series
  # batch: 2048
  # ubatch: 2048
  # cache_ram: 65536      # --cache-ram: MiB allocated for unified KV cache
  # parallel_slots: 1
  # max_checkpoints: 8    # --ctx-checkpoints
  # cache_reuse: 16       # --cache-reuse
  # ncmoe_gemma26: ""     # 100% Metal GPU offload (no CPU offload needed)
  # ncmoe_qwen35: ""      # 100% Metal GPU offload (no CPU offload needed)
  # gemma_template: "--chat-template-file ${env.HOME}/llama-swap/gemma4.jinja"
  #
  # hw_args: "-t ${threads} -tb ${threads_batch} -b ${batch} -ub ${ubatch} -lm mmap+mlock -bs --swa-full"
  # kv_args: "--kv-unified --parallel ${parallel_slots} --cache-ram ${cache_ram} --cache-idle-slots --ctx-checkpoints ${max_checkpoints} --cache-reuse ${cache_reuse}"

  # ============================================================================
  # SHARED BASELINE CONFIGURATION
  # ============================================================================
  ctx: 131072
  maxTokens: 32768
  ctk: q8_0
  ctv: q8_0
  fa: on

  #dry_args: "--dry-multiplier 0.8 --dry-base 1.75 --dry-allowed-length 4 --dry-penalty-last-n 4096 --dry-sequence-breaker none"

  default_args: "--ctx-size ${ctx} -n ${maxTokens} -ctk ${ctk} -ctv ${ctv} -fa ${fa} ${hw_args} ${kv_args} --jinja"
  
# ==============================================================================
# INFERENCE ROUTINGS & BACKENDS
# ==============================================================================
models:

# --- GEMMA 4 12B ---
  gemma4-12b:
    name: "Unsloth Gemma 4 12B"
    description: "unsloth/gemma-4-12b-it-qat-GGUF:UD-Q4_K_XL"
    capabilities:
      in: ["text", "image", "audio"]
      out: ["text"]
      tools: true
      context: ${ctx}
    cmd: |
      ${llama-server}
      ${default_args}
      ${gemma_template}
      -hf unsloth/gemma-4-12b-it-qat-GGUF:UD-Q4_K_XL
      --spec-type draft-mtp
      --spec-draft-p-min 0.75
      --spec-draft-n-max 2
    filters:
      setParamsByID:
        "${MODEL_ID}:no_think":
          temperature: 0.2
          top_p: 0.90
          min_p: 0.01
          chat_template_kwargs:
            enable_thinking: false

