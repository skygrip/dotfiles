# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
# ==============================================================================
# GLOBAL ENGINE CONFIGURATION
# ==============================================================================
host: "0.0.0.0"
port: 8080
globalTTL: 60
includeAliasesInList: true
healthCheckTimeout: 600

# ==============================================================================
# MACROS & ENVIRONMENT ALIASES
# ==============================================================================
macros:
  llama-server: "llama-server.exe --port ${PORT}"
  ctx: 8192
  ctk: q8_0
  ctv: q8_0
  fa: on
  temp: 0.7
  topp: 0.95
  minp: 0.05
  topk: 40
  repeat_penalty: 1.0
  batch_size: "-b 2048 -ub 1024"
  thread_args: "-t 8 -tb 16"
  default_args: "--ctx-size ${ctx} -ctk ${ctk} -ctv ${ctv} -fa ${fa} ${batch_size} ${thread_args} --temp ${temp} --top-p ${topp} --min-p ${minp} --top-k ${topk} --repeat-penalty ${repeat_penalty}"
  
# ==============================================================================
# INFERENCE ROUTINGS & BACKENDS
# ==============================================================================
models:

# --- GEMMA 4 12B ---
  gemma4-12b:
    name: "Unsloth Gemma 4 12B"
    description: "unsloth/gemma-4-12b-it-qat-GGUF:UD-Q4_K_XL"
    capabilities:
      in:
        - text
        - audio
        - image
      out: ["text"]
      tools: true
      context: 65536
    macros:
      ctx: 65536
      temp: 1.0
      topp: 0.95
      minp: 0.01
      topk: 64
      repeat_penalty: 1.0
    cmd: |
      ${llama-server}
      ${default_args}
      -hf unsloth/gemma-4-12b-it-qat-GGUF:UD-Q4_K_XL
      --spec-type draft-mtp
      --spec-draft-p-min 0.75
      --spec-draft-n-max 2
      --no-mmproj-offload
      --jinja
    filters:
      setParamsByID:
        "${MODEL_ID}:no_think":
          temperature: 0.2
          top_p: 0.90
          min_p: 0.01
          chat_template_kwargs:
            enable_thinking: false

